<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="keywords" content="site de la mort qui tue pas, site de la mort qui tue, SiteDeLaMortQuiTue, lambyx176">
		<title>SiteDeLaMortQuiTue</title>
		<script>
			let a = ''
			let compteur = 0

			const succesList = [
				{ seuil: 0, texte: "aucun pour l'instant" },
				{ seuil: 1, texte: "bouton novice" },
				{ seuil: 10, texte: "Débutant du bouton" },
				{ seuil: 25, texte: "boutonneur du quartier" },
				{ seuil: 50, texte: "Tu n'as vraiment rien d'autre à faire ?" },
				{ seuil: 67, texte: "non je ne vais pas le faire !" },
				{ seuil: 100, texte: "bouton amélioré" },
				{ seuil: 250, texte: "tu n'as SÉRIEUSEMENT rien d'autre a faire ?" },
				{ seuil: 404, texte: "404 pas trouvé" },
				{ seuil: 413, texte: "erreur 413, je suis une théière" },
				{ seuil: 500, texte: "bouton de bronze" },
				{ seuil: 666, texte: "O_O" }
			];

			function nbr() {
				if (confirm('tu veux mettre un nombre ?')) {
					a = (prompt("tu veux mettre quoi comme nombre ?"))
					if (a === null || a === '' ) {
						a = 'rien car tu as refusé au début !'
						document.getElementById('a').textContent = a;
					} else {
						if (isNaN(a)) {
							alert("c'est pas un nombre !")
							nbr()
						} else {
							a = parseInt(a)
							document.getElementById('a').textContent = a;
						}
					}
				} else {
					a = 'rien car tu as refusé au début !'
					document.getElementById('a').textContent = a;
				}
				localStorage.setItem('a', a)
			}

			function btnclick() {
				compteur = compteur + 1
				document.getElementById('btn').textContent = compteur;
				MàJBadge()
				localStorage.setItem('compteur', compteur)
				if (!document.getElementById('btn-checkbox').checked) {
					alert("BOUTONNNNNNNNNNNNN")
				}
			}
			function MàJBadge() {
				for (let i = 0; i < succesList.length; i++) {
        			let s = succesList[i];
        			let nextSeuil = i + 1 < succesList.length ? succesList[i + 1].seuil : Infinity;
        			if (compteur >= s.seuil && compteur < nextSeuil) {
            			document.getElementById('badge').textContent = s.seuil + ": " + s.texte;
					}
				}
			}
			function demarage() {
				//initialisation du bios avec le fichier 1.543ko
				if (localStorage.getItem("case") === null) {
					localStorage.setItem("case", false)
				}
				let LSa = localStorage.getItem('a')
				if ( LSa !== null ) {
					a = LSa
					document.getElementById('a').textContent = a;
				} else { nbr() }

				let LSc = localStorage.getItem('compteur')
				if ( LSc !== null ) {
					compteur = parseInt(LSc)
					document.getElementById('btn').textContent = compteur;
				} MàJBadge()
				document.getElementById("btn-checkbox").checked = localStorage.getItem("case")
			}
			function btnckbxclick() {
				if (localStorage.getItem("case")) {
					localStorage.setItem("case", false)
				} else {
					localStorage.setItem("case", true)
				}
			}
		</script>
		<style>
			/* Ton fond sombre et ton texte clair restaurés */
			body {
				background-color: #1a1a1a;
				color: #eeeeee;
				margin: 20px;
			}

			h1 {
				color: #ffffff;
				text-align: center;
			}

			/* Ton bouton avec sa bordure rouge de 10px restauré */
			.btn1 {

				border-style: solid;

				border-color: #ff0000;

				cursor: pointer;
				padding: 0;
				transition: 0.1s ease;
			}

			}
			
			label {

				margin-bottom: 10px;
			}

			/* Disposition globale : Cote a cote sur PC, superpose sur petit ecran */
			.page-layout {
				display: flex;
				flex-wrap: wrap; /* Permet de passer en dessous sur mobile */
				justify-content: space-between;

				gap: 20px;

			}

			.partie-droite {

			}
			/* La fenetre a droite */
			.fenetre-droite {
				width: 400px;

				background: linear-gradient(to bottom, #2bc0ff, #e6f8ff);
				border: 8px solid #ffffff;
				border-radius: 8px;
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 2rem;
				box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
			}
			.btnreni {
				background-color: #aaaaaa;
				border: 5px solid #ff1a1a;
				display: block;
				background: none;
				padding: 0;
				-webkit-apparence: none;
			}
		</style>
	</head>

</html>
